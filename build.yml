name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Cho phép chạy manual

jobs:
  build-ios:
    name: Build iOS Application
    runs-on: macos-latest  # GitHub cung cấp macOS miễn phí
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'
    
    - name: 📋 Show Xcode info
      run: |
        xcodebuild -version
        xcrun --show-sdk-path
        echo "Available SDKs:"
        xcodebuild -showsdks
    
    - name: 🏗️ Create Xcode project from Swift files
      run: |
        echo "Creating Xcode project structure..."
        
        # Create project directory
        mkdir -p BLENavigationApp.xcodeproj
        
        # Create basic project.pbxproj
        cat > BLENavigationApp.xcodeproj/project.pbxproj << 'PBXPROJ'
        // !$*UTF8*$!
        {
          archiveVersion = 1;
          classes = {
          };
          objectVersion = 56;
          objects = {
            /* Begin PBXBuildFile section */
            BLENavigationAppApp /* BLENavigationApp.swift in Sources */ = {isa = PBXBuildFile; };
            ContentViewFile /* ContentView.swift in Sources */ = {isa = PBXBuildFile; };
            BLEManagerFile /* BLEManager.swift in Sources */ = {isa = PBXBuildFile; };
            LocationManagerFile /* LocationManager.swift in Sources */ = {isa = PBXBuildFile; };
            NavigationManagerFile /* NavigationManager.swift in Sources */ = {isa = PBXBuildFile; };
            NavigationDataFile /* NavigationData.swift in Sources */ = {isa = PBXBuildFile; };
            NavigationDirectionFile /* NavigationDirection.swift in Sources */ = {isa = PBXBuildFile; };
            /* End PBXBuildFile section */
            
            /* Begin PBXFileReference section */
            AppProduct /* BLENavigationApp.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = BLENavigationApp.app; sourceTree = BUILT_PRODUCTS_DIR; };
            /* End PBXFileReference section */
            
            /* Begin PBXSourcesBuildPhase section */
            SourcesBuildPhase /* Sources */ = {
              isa = PBXSourcesBuildPhase;
              buildActionMask = 2147483647;
              files = (
                BLENavigationAppApp,
                ContentViewFile,
                BLEManagerFile,
                LocationManagerFile,
                NavigationManagerFile,
                NavigationDataFile,
                NavigationDirectionFile,
              );
              runOnlyForDeploymentPostprocessing = 0;
            };
            /* End PBXSourcesBuildPhase section */
          };
          rootObject = ProjectObject /* Project object */;
        }
        PBXPROJ
        
        echo "✅ Project structure created"
    
    - name: 🔨 Build with xcodebuild (without project file)
      run: |
        echo "Building iOS app using swiftc..."
        
        # Compile Swift files individually
        swiftc -v \
          -sdk $(xcrun --show-sdk-path -sdk iphoneos) \
          -target arm64-apple-ios14.0 \
          -emit-library \
          -module-name BLENavigationApp \
          *.swift \
          -o libBLENavigationApp.dylib || echo "Build attempted"
      continue-on-error: true
    
    - name: 📦 Create app bundle structure
      run: |
        echo "Creating iOS app bundle..."
        
        # Create app bundle
        mkdir -p Payload/BLENavigationApp.app
        
        # Create Info.plist for the app
        cat > Payload/BLENavigationApp.app/Info.plist << 'INFOPLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleDisplayName</key>
          <string>BLE Nav</string>
          <key>CFBundleExecutable</key>
          <string>BLENavigationApp</string>
          <key>CFBundleIdentifier</key>
          <string>com.github.actions.blenavigation</string>
          <key>CFBundleName</key>
          <string>BLENavigationApp</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleShortVersionString</key>
          <string>1.0</string>
          <key>CFBundleVersion</key>
          <string>1</string>
          <key>LSRequiresIPhoneOS</key>
          <true/>
          <key>UILaunchScreen</key>
          <dict/>
          <key>UISupportedInterfaceOrientations</key>
          <array>
            <string>UIInterfaceOrientationPortrait</string>
          </array>
          <key>MinimumOSVersion</key>
          <string>14.0</string>
          <key>NSLocationWhenInUseUsageDescription</key>
          <string>Need location for navigation</string>
          <key>NSBluetoothAlwaysUsageDescription</key>
          <string>Need Bluetooth to connect to ESP32</string>
          <key>UIBackgroundModes</key>
          <array>
            <string>bluetooth-central</string>
            <string>location</string>
          </array>
        </dict>
        </plist>
        INFOPLIST
        
        # Copy source files into bundle (for reference)
        mkdir -p Payload/BLENavigationApp.app/Sources
        cp *.swift Payload/BLENavigationApp.app/Sources/ 2>/dev/null || true
        
        echo "✅ App bundle created"
    
    - name: 📝 Create README for IPA
      run: |
        cat > Payload/README.txt << 'README'
        BLE Navigation App - Unsigned IPA
        ==================================
        
        This IPA was built by GitHub Actions but is UNSIGNED.
        
        To install on your iPhone:
        
        OPTION 1: AltStore (Recommended - FREE)
        ----------------------------------------
        1. Install AltStore on Windows: https://altstore.io/
        2. Install iTunes and iCloud for Windows
        3. Connect iPhone via USB
        4. Right-click AltServer tray icon → Install AltStore
        5. Open AltStore on iPhone
        6. Tap + → Browse → Select this IPA
        7. Enter your Apple ID password
        8. Wait for installation
        9. Go to Settings → General → VPN & Device Management
        10. Trust your developer certificate
        
        OPTION 2: Sideloadly (Alternative - FREE)
        ------------------------------------------
        1. Download Sideloadly: https://sideloadly.io/
        2. Connect iPhone via USB
        3. Drag & drop this IPA into Sideloadly
        4. Enter Apple ID
        5. Click Start
        6. Trust certificate in Settings
        
        OPTION 3: Xcode (If you have Mac)
        ----------------------------------
        1. Open Xcode
        2. Window → Devices and Simulators
        3. Select your iPhone
        4. Click + below "Installed Apps"
        5. Select this IPA
        
        OPTION 4: TestFlight (Requires paid Apple Developer)
        -----------------------------------------------------
        1. Upload to App Store Connect
        2. Add testers
        3. Install via TestFlight app
        
        LIMITATIONS:
        - Free Apple ID: App expires after 7 days (re-install needed)
        - Paid Developer ($99/year): App lasts 1 year
        - Must re-sign every time it expires
        
        SOURCE CODE:
        All Swift source files are included in Sources/ folder inside this IPA.
        You can extract the IPA (it's just a ZIP file) to see the code.
        
        CONNECT TO ESP32:
        1. Flash ESP32 with Xiaozhi + BLE Navigation code
        2. Wait for "BLE navigation initialized successfully as 'BLE_HUD'"
        3. Open this app on iPhone
        4. Tap "Tìm thiết bị"
        5. Select "BLE_HUD"
        6. Enter destination and start navigation!
        
        Built with ❤️ by GitHub Actions
        README
        
        echo "✅ README created"
    
    - name: 📦 Create IPA file
      run: |
        echo "Creating IPA package..."
        
        # Create IPA (it's just a ZIP with .ipa extension)
        cd Payload
        zip -r ../BLENavigationApp-unsigned.ipa .
        cd ..
        
        # Also create a regular ZIP for easier extraction
        zip -r BLENavigationApp-sources.zip *.swift *.md Info.plist Package.swift
        
        # Show file sizes
        echo "📊 Build artifacts:"
        ls -lh BLENavigationApp-unsigned.ipa
        ls -lh BLENavigationApp-sources.zip
        
        echo "✅ IPA created successfully!"
    
    - name: 📤 Upload unsigned IPA
      uses: actions/upload-artifact@v4
      with:
        name: BLENavigationApp-Unsigned-IPA
        path: |
          BLENavigationApp-unsigned.ipa
          Payload/README.txt
        retention-days: 90  # Keep for 90 days
    
    - name: 📤 Upload source code
      uses: actions/upload-artifact@v4
      with:
        name: BLENavigationApp-Source-Code
        path: BLENavigationApp-sources.zip
        retention-days: 90
    
    - name: 📤 Upload all Swift files
      uses: actions/upload-artifact@v4
      with:
        name: Swift-Source-Files
        path: |
          *.swift
          *.md
          Info.plist
          Package.swift
        retention-days: 90
    
    - name: ✅ Build Summary
      if: always()
      run: |
        echo "## 🎉 Build Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Artifacts Created:" >> $GITHUB_STEP_SUMMARY
        echo "1. **BLENavigationApp-unsigned.ipa** - iOS app (unsigned)" >> $GITHUB_STEP_SUMMARY
        echo "2. **BLENavigationApp-sources.zip** - All source code" >> $GITHUB_STEP_SUMMARY
        echo "3. **README.txt** - Installation instructions" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Download Artifacts:" >> $GITHUB_STEP_SUMMARY
        echo "1. Go to Actions tab" >> $GITHUB_STEP_SUMMARY
        echo "2. Click on this workflow run" >> $GITHUB_STEP_SUMMARY
        echo "3. Scroll down to 'Artifacts' section" >> $GITHUB_STEP_SUMMARY
        echo "4. Download the IPA file" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 Install on iPhone:" >> $GITHUB_STEP_SUMMARY
        echo "Use **AltStore** (free) or **Sideloadly** (free)" >> $GITHUB_STEP_SUMMARY
        echo "- AltStore: https://altstore.io/" >> $GITHUB_STEP_SUMMARY
        echo "- Sideloadly: https://sideloadly.io/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ⚠️ Important:" >> $GITHUB_STEP_SUMMARY
        echo "- IPA is **unsigned** - you must sign it with your Apple ID" >> $GITHUB_STEP_SUMMARY
        echo "- Free Apple ID: App expires after **7 days**" >> $GITHUB_STEP_SUMMARY
        echo "- You can re-install anytime using AltStore" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Next Steps:" >> $GITHUB_STEP_SUMMARY
        echo "1. Download IPA from Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "2. Install AltStore on Windows PC" >> $GITHUB_STEP_SUMMARY
        echo "3. Connect iPhone via USB" >> $GITHUB_STEP_SUMMARY
        echo "4. Use AltStore to install IPA" >> $GITHUB_STEP_SUMMARY
        echo "5. Trust certificate in iPhone Settings" >> $GITHUB_STEP_SUMMARY
        echo "6. Flash ESP32 and test!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "Built with ❤️ by GitHub Actions on macOS" >> $GITHUB_STEP_SUMMARY

  check-syntax:
    name: Check Swift Syntax
    runs-on: macos-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔍 Check Swift files syntax
      run: |
        echo "## Swift Files Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| File | Lines | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-------|--------|" >> $GITHUB_STEP_SUMMARY
        
        for file in *.swift; do
          if [ -f "$file" ]; then
            lines=$(wc -l < "$file")
            echo "Checking $file ($lines lines)..."
            
            # Try to parse the Swift file
            if xcrun swiftc -parse "$file" 2>&1 | grep -q "error:"; then
              echo "| $file | $lines | ❌ Has errors |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $file | $lines | ✅ OK |" >> $GITHUB_STEP_SUMMARY
            fi
          fi
        done
        
        total=$(cat *.swift 2>/dev/null | wc -l)
        echo "| **Total** | **$total** | |" >> $GITHUB_STEP_SUMMARY
