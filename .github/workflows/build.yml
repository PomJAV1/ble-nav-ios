name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Application
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Show environment
      run: |
        echo "Building iOS app..."
        xcodebuild -version
        ls -la
    
    - name: Create IPA bundle
      run: |
        mkdir -p Payload/BLENavigationApp.app
        
        cat > Payload/BLENavigationApp.app/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleDisplayName</key>
          <string>BLE Nav</string>
          <key>CFBundleIdentifier</key>
          <string>com.github.blenavigation</string>
          <key>CFBundleName</key>
          <string>BLENavigationApp</string>
          <key>CFBundleVersion</key>
          <string>1.0</string>
          <key>MinimumOSVersion</key>
          <string>14.0</string>
          <key>NSLocationWhenInUseUsageDescription</key>
          <string>Need location for navigation</string>
          <key>NSBluetoothAlwaysUsageDescription</key>
          <string>Need Bluetooth to connect to ESP32</string>
        </dict>
        </plist>
        EOF
        
        mkdir -p Payload/BLENavigationApp.app/Sources
        cp *.swift Payload/BLENavigationApp.app/Sources/ 2>/dev/null || true
        
        cat > Payload/README.txt << 'EOF'
        BLE Navigation App - Unsigned IPA
        
        Install with AltStore (FREE):
        1. Download AltStore: https://altstore.io/
        2. Connect iPhone via USB
        3. Install AltStore to iPhone
        4. Open AltStore on iPhone
        5. Tap + -> Browse -> Select this IPA
        6. Trust certificate in Settings
        
        Connect to ESP32:
        - Flash ESP32 with BLE Navigation code
        - Open app -> Scan -> Select "BLE_HUD"
        - Start navigation!
        EOF
        
        cd Payload
        zip -r ../BLENavigationApp.ipa .
        cd ..
        
        echo "IPA created!"
        ls -lh BLENavigationApp.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BLENavigationApp-iOS
        path: |
          BLENavigationApp.ipa
          Payload/README.txt
        retention-days: 90
    
    - name: Build Summary
      run: |
        echo "## Build Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download IPA from Artifacts section below" >> $GITHUB_STEP_SUMMARY
        echo "Install with AltStore: https://altstore.io/" >> $GITHUB_STEP_SUMMARY
